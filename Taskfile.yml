version: '3'

vars:
  ROOT_DIR: '{{default .TASKFILE_DIR .ROOT_DIR}}'
  SERVICE: '{{default "user" .SERVICE}}'
  CONFIG_PATH: '{{default (printf "./services/%s/config/%s.yaml" (default "user" .SERVICE) (default "user" .SERVICE)) .CONFIG_PATH}}'
  BIN_DIR: '{{default "bin" .BIN_DIR}}'
  DEV_DIR: '{{default ".dev" .DEV_DIR}}'
  DEV_LOG_DIR: '{{default ".dev/logs" .DEV_LOG_DIR}}'
  DEV_PID_DIR: '{{default ".dev/pids" .DEV_PID_DIR}}'
  IMAGE_REPOSITORY: '{{default "master-go-cqrs" .IMAGE_REPOSITORY}}'
  IMAGE_TAG: '{{default "local" .IMAGE_TAG}}'
  K3D_CLUSTER: '{{default "master-go-cqrs" .K3D_CLUSTER}}'
  K8S_NAMESPACE: '{{default "master-go-cqrs" .K8S_NAMESPACE}}'
  K3D_CONFIG: '{{default "dockers/k3d/cluster.yaml" .K3D_CONFIG}}'
  K3D_MANIFEST_DIR: '{{default "dockers/k3d/manifests" .K3D_MANIFEST_DIR}}'
  KUBE_CONFIG: '{{default (printf "%s/.dev/kubeconfig" .ROOT_DIR) .KUBE_CONFIG}}'
  ISTIO_VERSION: '{{default "1.26.3" .ISTIO_VERSION}}'
  ISTIO_PROFILE: '{{default "default" .ISTIO_PROFILE}}'
  ISTIOCTL: '{{default ".dev/tools/istioctl" .ISTIOCTL}}'
  TELEPRESENCE_VERSION: '{{default "2.28.0" .TELEPRESENCE_VERSION}}'
  TELEPRESENCE: '{{default ".dev/tools/telepresence" .TELEPRESENCE}}'
  TELEPRESENCE_MANAGER_NAMESPACE: '{{default "ambassador" .TELEPRESENCE_MANAGER_NAMESPACE}}'
  TELEPRESENCE_CONNECT_TIMEOUT: '{{default "5m" .TELEPRESENCE_CONNECT_TIMEOUT}}'
  AIR_VERSION: '{{default "1.65.3" .AIR_VERSION}}'
  AIR: '{{default ".dev/tools/air" .AIR}}'
  MIGRATIONS_DIR: '{{default (printf "services/%s/migrations" (default "payment" .SERVICE)) .MIGRATIONS_DIR}}'
  MIGRATION_NAME: '{{default "" .NAME}}'
  DB_HOST: '{{default "postgres.master-go-cqrs.svc.cluster.local" .DB_HOST}}'
  DB_PORT: '{{default "5432" .DB_PORT}}'
  DB_USER: '{{default (printf "master_go_cqrs_%s_user" (default "payment" .SERVICE)) .DB_USER}}'
  DB_PASSWORD: '{{default (printf "master_go_cqrs_%s_password" (default "payment" .SERVICE)) .DB_PASSWORD}}'
  DB_NAME: '{{default (printf "master_go_cqrs_%s" (default "payment" .SERVICE)) .DB_NAME}}'

env:
  KUBECONFIG: '{{.KUBE_CONFIG}}'

includes:
  go:
    taskfile: ./tasks/go.yml
    dir: .
    flatten: true
  proto:
    taskfile: ./tasks/proto.yml
    dir: .
    flatten: true
  migrations:
    taskfile: ./tasks/migrations.yml
    dir: .
    flatten: true
  dev:
    taskfile: ./tasks/dev.yml
    dir: .
    flatten: true
  k3d:
    taskfile: ./tasks/k3d.yml
    dir: .
    flatten: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list
