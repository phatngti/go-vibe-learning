version: '3'

vars:
  SERVICE: '{{default "app" .SERVICE}}'
  CONFIG_PATH: '{{default (printf "./config/%s.yaml" (default "app" .SERVICE)) .CONFIG_PATH}}'
  BIN_DIR: '{{default "bin" .BIN_DIR}}'
  DEV_DIR: '{{default ".dev" .DEV_DIR}}'
  DEV_LOG_DIR: '{{default ".dev/logs" .DEV_LOG_DIR}}'
  DEV_PID_DIR: '{{default ".dev/pids" .DEV_PID_DIR}}'
  IMAGE_REPOSITORY: '{{default "master-go-cqrs" .IMAGE_REPOSITORY}}'
  IMAGE_TAG: '{{default "local" .IMAGE_TAG}}'
  MIGRATIONS_DIR: '{{default (printf "migrations/%s" (default "app" .SERVICE)) .MIGRATIONS_DIR}}'
  MIGRATION_NAME: '{{default "" .NAME}}'
  DB_HOST: '{{default "127.0.0.1" .DB_HOST}}'
  DB_PORT: '{{default "15432" .DB_PORT}}'
  DB_USER: '{{default (printf "master_go_cqrs_%s_user" (default "app" .SERVICE)) .DB_USER}}'
  DB_PASSWORD: '{{default (printf "master_go_cqrs_%s_password" (default "app" .SERVICE)) .DB_PASSWORD}}'
  DB_NAME: '{{default (printf "master_go_cqrs_%s" (default "app" .SERVICE)) .DB_NAME}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  deps:
    desc: Download Go dependencies
    cmds:
      - go mod download

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Format Go files
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  proto-tools:
    desc: Install protobuf plugins needed for Go, gRPC, Envoy descriptor, and Swagger generation
    cmds:
      - |
        set -eu
        protoc_bin="${PROTOC:-}"
        if [ -z "$protoc_bin" ]; then
          for candidate in /opt/homebrew/bin/protoc /usr/local/bin/protoc /usr/bin/protoc "$(command -v protoc 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ] && "$candidate" --version >/dev/null 2>&1; then
              protoc_bin="$candidate"
              break
            fi
          done
        fi
        if [ -z "$protoc_bin" ]; then
          echo "protoc is required. Install protobuf or set PROTOC=/path/to/protoc."
          exit 1
        fi
        "$protoc_bin" --version
        export PATH="$(go env GOPATH)/bin:$PATH"
        if ! command -v protoc-gen-go >/dev/null; then
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
        fi
        if ! command -v protoc-gen-go-grpc >/dev/null; then
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
        fi
        if ! command -v protoc-gen-openapiv2 >/dev/null; then
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.24.0
        fi

  gen-proto:
    desc: Regenerate Go protobuf, Envoy descriptor, and Swagger docs from proto/*.proto
    aliases:
      - proto-gen
      - gen-gateway
    cmds:
      - task: proto-tools
      - |
        set -eu
        export PATH="$(go env GOPATH)/bin:$PATH"
        mkdir -p docs dockers/envoy
        protoc_bin="${PROTOC:-}"
        if [ -z "$protoc_bin" ]; then
          for candidate in /opt/homebrew/bin/protoc /usr/local/bin/protoc /usr/bin/protoc "$(command -v protoc 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ] && "$candidate" --version >/dev/null 2>&1; then
              protoc_bin="$candidate"
              break
            fi
          done
        fi
        if [ -z "$protoc_bin" ]; then
          echo "protoc is required. Install protobuf or set PROTOC=/path/to/protoc."
          exit 1
        fi
        grpc_gateway_dir=$(go list -m -f '{{"{{"}}.Dir{{"}}"}}' github.com/grpc-ecosystem/grpc-gateway/v2)
        "$protoc_bin" -I. -Ithird_party -I"$grpc_gateway_dir" \
          --go_out=. --go_opt=module=github/master_go_cqrs \
          --go-grpc_out=. --go-grpc_opt=module=github/master_go_cqrs \
          proto/*.proto
        "$protoc_bin" -I. -Ithird_party -I"$grpc_gateway_dir" \
          --include_imports --include_source_info \
          --descriptor_set_out=dockers/envoy/proto.pb \
          proto/*.proto
        "$protoc_bin" -I. -Ithird_party -I"$grpc_gateway_dir" \
          --openapiv2_out=allow_merge=true,merge_file_name=envoy,json_names_for_fields=false,logtostderr=true:docs \
          proto/*.proto

  swagger-tools:
    desc: Install Swaggo CLI needed for API Swagger generation
    cmds:
      - |
        set -eu
        export PATH="$(go env GOPATH)/bin:$PATH"
        if ! command -v swag >/dev/null; then
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
        fi

  gen-swagger:
    desc: Regenerate API Swagger docs from handler annotations and DTO schemas
    aliases:
      - swagger-gen
    cmds:
      - task: swagger-tools
      - |
        set -eu
        export PATH="$(go env GOPATH)/bin:$PATH"
        swag init \
          --generalInfo main.go \
          --dir ./cmd/app,./internal \
          --output docs \
          --outputTypes json,yaml \
          --parseInternal \
          --quiet

  gen-docs:
    desc: Regenerate API Swagger docs and Envoy gateway OpenAPI docs
    cmds:
      - task: gen-swagger
      - task: gen-proto

  migrate-create:
    desc: Create a migration pair for a service. Usage `task migrate-create SERVICE=payment NAME=create_orders`
    aliases:
      - migrate-new
    vars:
      SERVICE: '{{default "app" .SERVICE}}'
      MIGRATIONS_DIR: '{{default (printf "migrations/%s" (default "app" .SERVICE)) .MIGRATIONS_DIR}}'
      MIGRATION_NAME: '{{default "" .NAME}}'
    cmds:
      - |
        set -eu
        dir="{{.MIGRATIONS_DIR}}"
        name="{{.MIGRATION_NAME}}"
        if [ -z "$name" ]; then
          echo "NAME is required. Example: task migrate-create SERVICE=payment NAME=create_orders"
          exit 1
        fi
        slug=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g; s/^_+|_+$//g')
        if [ -z "$slug" ]; then
          echo "NAME must contain at least one letter or number"
          exit 1
        fi
        mkdir -p "$dir"
        last=$(find "$dir" -maxdepth 1 -name '[0-9][0-9][0-9][0-9][0-9][0-9]_*.up.sql' -print | sed -E 's|.*/([0-9]{6})_.*|\1|' | sort -n | tail -1)
        if [ -z "$last" ]; then
          next=1
        else
          next=$(expr "$last" + 1)
        fi
        version=$(printf '%06d' "$next")
        up="$dir/${version}_${slug}.up.sql"
        down="$dir/${version}_${slug}.down.sql"
        if [ -e "$up" ] || [ -e "$down" ]; then
          echo "Migration already exists for version $version"
          exit 1
        fi
        touch "$up" "$down"
        echo "Created $up"
        echo "Created $down"

  migrate-up:
    desc: Apply the next pending migration for one service
    aliases:
      - migrate-run
    vars:
      SERVICE: '{{default "app" .SERVICE}}'
      MIGRATIONS_DIR: '{{default (printf "migrations/%s" (default "app" .SERVICE)) .MIGRATIONS_DIR}}'
      DB_NAME: '{{default (printf "master_go_cqrs_%s" (default "app" .SERVICE)) .DB_NAME}}'
    cmds:
      - |
        set -eu
        dir="{{.MIGRATIONS_DIR}}"
        if [ ! -d "$dir" ]; then
          echo "Migration folder does not exist: $dir"
          exit 1
        fi
        export PGPASSWORD="{{.DB_PASSWORD}}"
        psql -v ON_ERROR_STOP=1 -h "{{.DB_HOST}}" -p "{{.DB_PORT}}" -U "{{.DB_USER}}" -d "{{.DB_NAME}}" -c "CREATE TABLE IF NOT EXISTS public.schema_migrations (version TEXT PRIMARY KEY, name TEXT NOT NULL, applied_at TIMESTAMPTZ NOT NULL DEFAULT now());"
        next_file=""
        for file in $(find "$dir" -maxdepth 1 -name '*.up.sql' -type f | sort); do
          version=$(basename "$file" | cut -d '_' -f 1)
          applied=$(psql -At -h "{{.DB_HOST}}" -p "{{.DB_PORT}}" -U "{{.DB_USER}}" -d "{{.DB_NAME}}" -c "SELECT 1 FROM public.schema_migrations WHERE version = '$version' LIMIT 1;")
          if [ "$applied" != "1" ]; then
            next_file="$file"
            break
          fi
        done
        if [ -z "$next_file" ]; then
          echo "No pending migrations for {{.SERVICE}}"
          exit 0
        fi
        version=$(basename "$next_file" | cut -d '_' -f 1)
        name=$(basename "$next_file" .up.sql)
        echo "Applying $next_file to {{.DB_NAME}}"
        psql -v ON_ERROR_STOP=1 -h "{{.DB_HOST}}" -p "{{.DB_PORT}}" -U "{{.DB_USER}}" -d "{{.DB_NAME}}" -f "$next_file"
        psql -v ON_ERROR_STOP=1 -h "{{.DB_HOST}}" -p "{{.DB_PORT}}" -U "{{.DB_USER}}" -d "{{.DB_NAME}}" -c "INSERT INTO public.schema_migrations (version, name) VALUES ('$version', '$name');"

  migrate-up-all:
    desc: Apply all pending migrations for one service
    aliases:
      - migrate-run-all
    cmds:
      - |
        set -eu
        while true; do
          if ! output=$(task migrate-up SERVICE={{.SERVICE}} MIGRATIONS_DIR={{.MIGRATIONS_DIR}} DB_HOST={{.DB_HOST}} DB_PORT={{.DB_PORT}} DB_USER={{.DB_USER}} DB_PASSWORD={{.DB_PASSWORD}} DB_NAME={{.DB_NAME}}); then
            echo "$output"
            exit 1
          fi
          echo "$output"
          if echo "$output" | grep -q "No pending migrations"; then
            break
          fi
        done

  migrate-down:
    desc: Revert the latest applied migration for one service
    aliases:
      - migrate-revert
    vars:
      SERVICE: '{{default "app" .SERVICE}}'
      MIGRATIONS_DIR: '{{default (printf "migrations/%s" (default "app" .SERVICE)) .MIGRATIONS_DIR}}'
      DB_NAME: '{{default (printf "master_go_cqrs_%s" (default "app" .SERVICE)) .DB_NAME}}'
    cmds:
      - |
        set -eu
        dir="{{.MIGRATIONS_DIR}}"
        export PGPASSWORD="{{.DB_PASSWORD}}"
        psql -v ON_ERROR_STOP=1 -h "{{.DB_HOST}}" -p "{{.DB_PORT}}" -U "{{.DB_USER}}" -d "{{.DB_NAME}}" -c "CREATE TABLE IF NOT EXISTS public.schema_migrations (version TEXT PRIMARY KEY, name TEXT NOT NULL, applied_at TIMESTAMPTZ NOT NULL DEFAULT now());"
        version=$(psql -At -h "{{.DB_HOST}}" -p "{{.DB_PORT}}" -U "{{.DB_USER}}" -d "{{.DB_NAME}}" -c "SELECT version FROM public.schema_migrations ORDER BY version DESC LIMIT 1;")
        if [ -z "$version" ]; then
          echo "No applied migrations for {{.SERVICE}}"
          exit 0
        fi
        down_file=$(find "$dir" -maxdepth 1 -name "${version}_*.down.sql" -type f | sort | head -1)
        if [ -z "$down_file" ]; then
          echo "Missing down migration for version $version in $dir"
          exit 1
        fi
        echo "Reverting $down_file from {{.DB_NAME}}"
        psql -v ON_ERROR_STOP=1 -h "{{.DB_HOST}}" -p "{{.DB_PORT}}" -U "{{.DB_USER}}" -d "{{.DB_NAME}}" -f "$down_file"
        psql -v ON_ERROR_STOP=1 -h "{{.DB_HOST}}" -p "{{.DB_PORT}}" -U "{{.DB_USER}}" -d "{{.DB_NAME}}" -c "DELETE FROM public.schema_migrations WHERE version = '$version';"

  migrate-down-all:
    desc: Revert all applied migrations for one service
    aliases:
      - migrate-revert-all
    cmds:
      - |
        set -eu
        while true; do
          if ! output=$(task migrate-down SERVICE={{.SERVICE}} MIGRATIONS_DIR={{.MIGRATIONS_DIR}} DB_HOST={{.DB_HOST}} DB_PORT={{.DB_PORT}} DB_USER={{.DB_USER}} DB_PASSWORD={{.DB_PASSWORD}} DB_NAME={{.DB_NAME}}); then
            echo "$output"
            exit 1
          fi
          echo "$output"
          if echo "$output" | grep -q "No applied migrations"; then
            break
          fi
        done

  migrate-up-all-services:
    desc: Apply all pending migrations for every service database
    aliases:
      - migrate-run-all-services
    cmds:
      - task migrate-up-all SERVICE=app
      - task migrate-up-all SERVICE=payment
      - task migrate-up-all SERVICE=affiliate
      - task migrate-up-all SERVICE=settlement
      - task migrate-up-all SERVICE=agent

  migrate-down-all-services:
    desc: Revert all applied migrations from every service database
    aliases:
      - migrate-revert-all-services
    cmds:
      - task migrate-down-all SERVICE=agent
      - task migrate-down-all SERVICE=settlement
      - task migrate-down-all SERVICE=affiliate
      - task migrate-down-all SERVICE=payment
      - task migrate-down-all SERVICE=app

  run:
    desc: Run a service locally
    vars:
      SERVICE: '{{default "app" .SERVICE}}'
    cmds:
      - SERVICE_NAME={{.SERVICE}} CONFIG_PATH=./config/{{.SERVICE}}.yaml go run ./cmd/{{.SERVICE}}

  run-app:
    desc: Run the app service
    cmds:
      - task: run
        vars:
          SERVICE: app

  run-payment:
    desc: Run the payment service
    cmds:
      - task: run
        vars:
          SERVICE: payment

  run-affiliate:
    desc: Run the affiliate service
    cmds:
      - task: run
        vars:
          SERVICE: affiliate

  run-settlement:
    desc: Run the settlement service
    cmds:
      - task: run
        vars:
          SERVICE: settlement

  run-agent:
    desc: Run the agent service
    cmds:
      - task: run
        vars:
          SERVICE: agent

  run-orchestrator:
    desc: Run the orchestrator service
    cmds:
      - task: run
        vars:
          SERVICE: orchestrator

  dev-up:
    desc: Start infra, migrations, and app services in the background with per-service logs
    cmds:
      - task: setup-services
      - task: migrate-up-all-services
      - task: dev-start
      - task: gateway-up
      - task: gateway-smoke
      - task: dev-status

  dev-start:
    desc: Start app services in the background. Use SERVICES=name to start one service
    vars:
      SERVICES: '{{default "all" .SERVICES}}'
    cmds:
      - |
        set -eu
        services="{{.SERVICES}}"
        if [ "$services" = "all" ]; then
          services="app payment affiliate settlement agent orchestrator"
        fi
        mkdir -p "{{.DEV_LOG_DIR}}" "{{.DEV_PID_DIR}}"
        for service in $services; do
          pid_file="{{.DEV_PID_DIR}}/$service.pid"
          log_file="{{.DEV_LOG_DIR}}/$service.log"
          if [ -f "$pid_file" ] && /bin/kill -0 "$(cat "$pid_file")" >/dev/null 2>&1; then
            echo "$service already running pid=$(cat "$pid_file") log=$log_file"
            continue
          fi
          rm -f "$pid_file"
          : > "$log_file"
          mkdir -p "{{.BIN_DIR}}"
          go build -o "{{.BIN_DIR}}/$service" "./cmd/$service"
          pid=$(SERVICE_NAME="$service" CONFIG_PATH="./config/$service.yaml" BIN_PATH="{{.BIN_DIR}}/$service" LOG_FILE="$log_file" python3 -c 'import os, subprocess; env=os.environ.copy(); log=open(env["LOG_FILE"], "ab", buffering=0); process=subprocess.Popen([env["BIN_PATH"]], stdin=subprocess.DEVNULL, stdout=log, stderr=subprocess.STDOUT, env=env, close_fds=True, start_new_session=True); print(process.pid)')
          echo "$pid" > "$pid_file"
          echo "started $service pid=$(cat "$pid_file") log=$log_file"
        done

  dev-stop:
    desc: Stop app services started by dev-start. Use SERVICES=name to stop one service
    vars:
      SERVICES: '{{default "all" .SERVICES}}'
    cmds:
      - |
        set -eu
        services="{{.SERVICES}}"
        if [ "$services" = "all" ]; then
          services="app payment affiliate settlement agent orchestrator"
        fi
        for service in $services; do
          pid_file="{{.DEV_PID_DIR}}/$service.pid"
          if [ ! -f "$pid_file" ]; then
            echo "$service not running"
            continue
          fi
          pid=$(cat "$pid_file")
          if /bin/kill -0 "$pid" >/dev/null 2>&1; then
            /bin/kill "$pid"
            echo "stopped $service pid=$pid"
          else
            echo "$service pid=$pid is not alive"
          fi
          rm -f "$pid_file"
        done

  dev-restart:
    desc: Restart app services. Use SERVICES=name to restart one service
    vars:
      SERVICES: '{{default "all" .SERVICES}}'
    cmds:
      - task: dev-stop
        vars:
          SERVICES: '{{.SERVICES}}'
      - task: dev-start
        vars:
          SERVICES: '{{.SERVICES}}'

  dev-status:
    desc: Show infra containers and app service process status
    cmds:
      - cd dockers && docker compose ps postgres temporal jaeger otel keycloak api-gateway swagger-ui
      - |
        set -eu
        printf '\nApp services:\n'
        for service in app payment affiliate settlement agent orchestrator; do
          pid_file="{{.DEV_PID_DIR}}/$service.pid"
          if [ -f "$pid_file" ] && /bin/kill -0 "$(cat "$pid_file")" >/dev/null 2>&1; then
            printf '  %-14s running pid=%s log=%s\n' "$service" "$(cat "$pid_file")" "{{.DEV_LOG_DIR}}/$service.log"
          else
            printf '  %-14s stopped log=%s\n' "$service" "{{.DEV_LOG_DIR}}/$service.log"
          fi
        done

  dev-logs:
    desc: Follow app logs. Use SERVICES=name for one service, or SERVICES=all
    vars:
      SERVICES: '{{default "all" .SERVICES}}'
    cmds:
      - |
        set -eu
        mkdir -p "{{.DEV_LOG_DIR}}"
        if [ "{{.SERVICES}}" = "all" ]; then
          touch "{{.DEV_LOG_DIR}}"/app.log "{{.DEV_LOG_DIR}}"/payment.log "{{.DEV_LOG_DIR}}"/affiliate.log "{{.DEV_LOG_DIR}}"/settlement.log "{{.DEV_LOG_DIR}}"/agent.log "{{.DEV_LOG_DIR}}"/orchestrator.log
          tail -n 80 -F "{{.DEV_LOG_DIR}}"/*.log
        else
          touch "{{.DEV_LOG_DIR}}/{{.SERVICES}}.log"
          tail -n 160 -F "{{.DEV_LOG_DIR}}/{{.SERVICES}}.log"
        fi

  infra-logs:
    desc: Follow Docker infra logs. Use INFRA_SERVICE=postgres|temporal|jaeger|otel|keycloak or INFRA_SERVICE=all
    vars:
      INFRA_SERVICE: '{{default "all" .INFRA_SERVICE}}'
    cmds:
      - |
        set -eu
        cd dockers
        if [ "{{.INFRA_SERVICE}}" = "all" ]; then
          docker compose logs -f --tail=120 postgres temporal jaeger otel keycloak
        else
          docker compose logs -f --tail=160 "{{.INFRA_SERVICE}}"
        fi

  gateway-up:
    desc: Generate gateway artifacts and start Envoy API gateway at http://localhost:8888
    cmds:
      - task: gen-proto
      - cd dockers && docker compose up -d swagger-ui api-gateway
      - cd dockers && docker compose restart api-gateway
      - 'echo "Envoy API gateway: http://localhost:8888"'
      - 'echo "Swagger UI: http://localhost:8888/api/v1/swagger/"'

  gateway-stop:
    desc: Stop Envoy API gateway and Swagger UI
    cmds:
      - cd dockers && docker compose stop api-gateway swagger-ui

  gateway-validate:
    desc: Validate generated Envoy configuration
    cmds:
      - task: gen-proto
      - cd dockers && docker compose run --rm --no-deps api-gateway envoy --mode validate -c /etc/envoy/envoy.yaml

  gateway-smoke:
    desc: Verify Envoy, Swagger UI, and the generated service OpenAPI document are reachable
    cmds:
      - |
        set -eu
        gateway_url="${GATEWAY_URL:-http://localhost:8888}"
        root_status=""
        for attempt in $(seq 1 30); do
          root_status=$(curl -sS -o /dev/null -w '%{http_code}' "$gateway_url/" 2>/dev/null || true)
          if [ "$root_status" = "301" ] || [ "$root_status" = "302" ]; then
            break
          fi
          sleep 1
        done
        if [ "$root_status" != "301" ] && [ "$root_status" != "302" ]; then
          echo "Expected $gateway_url/ to redirect to Swagger UI, got HTTP $root_status"
          exit 1
        fi
        initializer=""
        for attempt in $(seq 1 30); do
          if initializer=$(curl -fsS "$gateway_url/api/v1/swagger/swagger-initializer.js" 2>/dev/null); then
            break
          fi
          sleep 1
        done
        if [ -z "$initializer" ]; then
          echo "Swagger UI initializer was not reachable at $gateway_url/api/v1/swagger/swagger-initializer.js"
          exit 1
        fi
        if echo "$initializer" | grep -q 'petstore.swagger.io'; then
          echo "Swagger UI is still configured for the Petstore example"
          exit 1
        fi
        echo "$initializer" | grep -q './swagger.json'
        swagger=""
        for attempt in $(seq 1 30); do
          if swagger=$(curl -fsS "$gateway_url/api/v1/swagger/swagger.json" 2>/dev/null); then
            break
          fi
          sleep 1
        done
        if [ -z "$swagger" ]; then
          echo "Generated Swagger document was not reachable at $gateway_url/api/v1/swagger/swagger.json"
          exit 1
        fi
        echo "$swagger" | grep -q '"PaymentService"'
        echo "$swagger" | grep -q '"AffiliateService"'
        echo "$swagger" | grep -q '"SettlementService"'
        echo "$swagger" | grep -q '"AgentConfigService"'
        for attempt in $(seq 1 30); do
          if curl -fsS "$gateway_url/api/v1/health" >/dev/null 2>&1; then
            echo "Gateway smoke check passed: $gateway_url"
            exit 0
          fi
          sleep 1
        done
        echo "API health endpoint was not reachable through Envoy at $gateway_url/api/v1/health"
        exit 1

  logs-ui:
    desc: Start Dozzle log UI for Docker infra and local app logs at http://localhost:9999
    cmds:
      - |
        set -eu
        mkdir -p "{{.DEV_LOG_DIR}}"
        touch "{{.DEV_LOG_DIR}}"/app.log "{{.DEV_LOG_DIR}}"/payment.log "{{.DEV_LOG_DIR}}"/affiliate.log "{{.DEV_LOG_DIR}}"/settlement.log "{{.DEV_LOG_DIR}}"/agent.log "{{.DEV_LOG_DIR}}"/orchestrator.log
        cd dockers
        docker compose --profile dev up -d log-monitor log-app log-payment log-affiliate log-settlement log-agent log-orchestrator
      - 'echo "Docker logs UI: http://localhost:9999"'
      - 'echo "App logs are forwarded from .dev/logs into master_go_cqrs_log_<service> containers"'


  build:
    desc: Build a service binary
    vars:
      SERVICE: '{{default "app" .SERVICE}}'
      BIN_DIR: '{{default "bin" .BIN_DIR}}'
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.SERVICE}} ./cmd/{{.SERVICE}}

  build-all:
    desc: Build all service binaries
    cmds:
      - task: build
        vars:
          SERVICE: app
      - task: build
        vars:
          SERVICE: payment
      - task: build
        vars:
          SERVICE: affiliate
      - task: build
        vars:
          SERVICE: settlement
      - task: build
        vars:
          SERVICE: agent
      - task: build
        vars:
          SERVICE: orchestrator

  image:
    desc: Build a Docker image for a service
    vars:
      SERVICE: '{{default "app" .SERVICE}}'
      IMAGE_REPOSITORY: '{{default "master-go-cqrs" .IMAGE_REPOSITORY}}'
      IMAGE_TAG: '{{default "local" .IMAGE_TAG}}'
    cmds:
      - docker build --target {{.SERVICE}} -t {{.IMAGE_REPOSITORY}}/{{.SERVICE}}:{{.IMAGE_TAG}} .

  image-all:
    desc: Build Docker images for all services
    cmds:
      - task: image
        vars:
          SERVICE: app
      - task: image
        vars:
          SERVICE: payment
      - task: image
        vars:
          SERVICE: affiliate
      - task: image
        vars:
          SERVICE: settlement
      - task: image
        vars:
          SERVICE: agent
      - task: image
        vars:
          SERVICE: orchestrator

  clean:
    desc: Remove local binaries
    cmds:
      - rm -rf {{.BIN_DIR}}

  # Lazy setup with one command
  setup-services:
    desc: Start docker compose to start all the services
    cmds:
      - cd dockers && docker compose up -d postgres temporal jaeger otel
      - task: wait-postgres
      - task: ensure-service-databases
      - cd dockers && docker compose up -d keycloak
      - task: wait-temporal
      - task: wait-jaeger
      - task: wait-otel
      - task: wait-keycloak

  ensure-service-databases:
    desc: Ensure local service databases and users exist with expected passwords
    cmds:
      - |
        set -eu
        compose_dir="{{.TASKFILE_DIR}}/dockers"
        cd "$compose_dir" && docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres -f /docker-entrypoint-initdb.d/01-create-service-databases.sql

  wait-postgres:
    desc: Wait until Postgres is ready to accept connections
    cmds:
      - |
        set -eu
        compose_dir="{{.TASKFILE_DIR}}/dockers"
        for attempt in $(seq 1 30); do
          if cd "$compose_dir" && docker compose exec -T postgres pg_isready -U postgres -d postgres >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        cd "$compose_dir" && docker compose ps postgres
        cd "$compose_dir" && docker compose logs --no-color --tail=80 postgres
        echo "Postgres did not become ready in time"
        exit 1

  wait-temporal:
    desc: Wait until Temporal is ready to accept connections
    cmds:
      - |
        set -eu
        compose_dir="{{.TASKFILE_DIR}}/dockers"
        for attempt in $(seq 1 60); do
          if cd "$compose_dir" && docker compose exec -T temporal tctl --address temporal:7233 workflow list >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        cd "$compose_dir" && docker compose ps temporal
        cd "$compose_dir" && docker compose logs --no-color --tail=120 temporal
        echo "Temporal did not become ready in time"
        exit 1

  wait-jaeger:
    desc: Wait until Jaeger is ready to accept traces
    cmds:
      - |
        set -eu
        compose_dir="{{.TASKFILE_DIR}}/dockers"
        for attempt in $(seq 1 30); do
          if curl -fsS http://localhost:16686/api/services >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        cd "$compose_dir" && docker compose ps jaeger
        cd "$compose_dir" && docker compose logs --no-color --tail=120 jaeger
        echo "Jaeger did not become ready in time"
        exit 1

  wait-otel:
    desc: Wait until the OpenTelemetry collector is ready to receive traces
    cmds:
      - |
        set -eu
        compose_dir="{{.TASKFILE_DIR}}/dockers"
        for attempt in $(seq 1 30); do
          if curl -fsS http://localhost:13133/ >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        cd "$compose_dir" && docker compose ps otel
        cd "$compose_dir" && docker compose logs --no-color --tail=120 otel
        echo "OpenTelemetry collector did not become ready in time"
        exit 1

  wait-keycloak:
    desc: Wait until Keycloak is ready to accept connections
    cmds:
      - |
        set -eu
        compose_dir="{{.TASKFILE_DIR}}/dockers"
        for attempt in $(seq 1 90); do
          if curl -fsS http://localhost:8080/realms/backend/.well-known/openid-configuration >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        cd "$compose_dir" && docker compose ps keycloak
        cd "$compose_dir" && docker compose logs --no-color --tail=160 keycloak
        echo "Keycloak did not become ready in time"
        exit 1
