syntax = "proto3";

package agent.v1;

import "google/api/annotations.proto";

option go_package = "github/master_go_cqrs/contracts/genproto/agent;agentv1";

message ConfigureCallbackRequest {
  string agent_id = 1;
  string callback_url = 2;
  repeated string allowed_ips = 3;
}

message ConfigureCallbackResponse {
  string agent_id = 1;
  bool success = 2;
  string message = 3;
  string callback_status = 4;
  string challenge_id = 5;
  string challenge_token = 6;
  string challenge_proof_url = 7;
  string challenge_expires_at = 8;
}

message VerifyCallbackRequest {
  string agent_id = 1;
  string challenge_id = 2;
  string challenge_token = 3;
}

message VerifyCallbackResponse {
  string agent_id = 1;
  bool success = 2;
  string callback_status = 3;
  string callback_verified_at = 4;
}

message ReplayCallbackRequest {
  string event_id = 1;
  string reason = 2;
}

message ReplayCallbackResponse {
  string event_id = 1;
  string status = 2;
  int64 outcome_generation = 3;
  int32 replay_count = 4;
}

message GenerateApiKeyRequest {
  string agent_id = 1;
}

message GenerateApiKeyResponse {
  string agent_id = 1;
  string api_key = 2;
  string created_at = 3;
}

message ValidateApiKeyRequest {
  string api_key = 1;
}

message ValidateApiKeyResponse {
  bool valid = 1;
  string agent_id = 2;
}

message RecordAuditLogRequest {
  string agent_id = 1;
  string action = 2;
  string details = 3;
}

message RecordAuditLogResponse {
  bool success = 1;
}

service AgentConfigService {
  rpc ConfigureCallback(ConfigureCallbackRequest) returns (ConfigureCallbackResponse) {
    option (google.api.http) = {
      post: "/api/v1/agent/config/callback"
      body: "*"
    };
  }
  rpc VerifyCallback(VerifyCallbackRequest) returns (VerifyCallbackResponse) {
    option (google.api.http) = {
      post: "/api/v1/agent/config/callback/verify"
      body: "*"
    };
  }
  rpc ReplayCallback(ReplayCallbackRequest) returns (ReplayCallbackResponse) {
    option (google.api.http) = {
      post: "/api/v1/agent/callbacks/{event_id}/replay"
      body: "*"
    };
  }
  rpc GenerateApiKey(GenerateApiKeyRequest) returns (GenerateApiKeyResponse) {
    option (google.api.http) = {
      post: "/api/v1/agent/config/key/generate"
      body: "*"
    };
  }
  rpc ValidateApiKey(ValidateApiKeyRequest) returns (ValidateApiKeyResponse);
  rpc RecordAuditLog(RecordAuditLogRequest) returns (RecordAuditLogResponse);
}
