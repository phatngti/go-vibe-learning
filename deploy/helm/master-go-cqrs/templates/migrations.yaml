{{- if .Values.migrations.enabled }}
{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "master-go-cqrs.serviceName" (dict "root" $ "name" (printf "%s-migrate" $name)) }}
  labels:
    {{- include "master-go-cqrs.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ printf "%s-migrate" $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ $.Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ printf "%s-migrate" $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "master-go-cqrs.serviceAccountName" $ }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ printf "%s@%s" $.Values.migrations.image.repository $.Values.migrations.image.digest | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args: [{{ $name | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          env:
            - {name: PGHOST, value: {{ $.Values.global.postgres.host | quote }}}
            - {name: PGPORT, value: {{ $.Values.global.postgres.port | quote }}}
            - {name: PGSSLMODE, value: {{ $.Values.global.postgres.sslMode | quote }}}
            - {name: PGSSLROOTCERT, value: /var/run/secrets/postgres/ca.crt}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: {{ printf "%s-name" $service.databaseSecretPrefix }}}}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: {{ printf "%s-migration-user" $service.databaseSecretPrefix }}}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.global.externalSecretName }}, key: {{ printf "%s-migration-password" $service.databaseSecretPrefix }}}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: postgres-ca
              mountPath: /var/run/secrets/postgres
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: {{ $.Values.global.externalSecretName }}
            items:
              - key: {{ $.Values.global.postgres.caSecretKey }}
                path: ca.crt
{{- end }}
{{- end }}
{{- end }}
