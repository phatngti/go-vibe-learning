name: master-go-cqrs-k3d

services:
  k3d:
    image: ${K3D_IMAGE:-ghcr.io/k3d-io/k3d:5.8.3-dind}
    container_name: master_go_cqrs_k3d_cli
    working_dir: /workspace
    entrypoint: ["k3d"]
    command: ["version"]
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      KUBECONFIG: /workspace/.dev/kubeconfig
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace
