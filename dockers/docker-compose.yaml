name: dockers

services:
  postgres:
    image: postgres:latest
    container_name: master_go_cqrs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:latest
    container_name: master_go_cqrs_temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: example
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 workflow list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: master_go_cqrs_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: master_go_cqrs_otel
    restart: unless-stopped
    depends_on:
      jaeger:
        condition: service_started
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: master_go_cqrs_keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: master_go_cqrs_keycloak
      KC_DB_USERNAME: master_go_cqrs_keycloak_user
      KC_DB_PASSWORD: master_go_cqrs_keycloak_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

  keycloak-disable-ssl:
    image: postgres:latest
    container_name: master_go_cqrs_keycloak_disable_ssl
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      PGPASSWORD: example
    command:
      - sh
      - -c
      - |
        until psql -h postgres -U postgres -d master_go_cqrs_keycloak -tAc "select 1 from realm limit 1" >/dev/null 2>&1; do
          sleep 2
        done
        psql -h postgres -U postgres -d master_go_cqrs_keycloak -c "update realm set ssl_required = 'NONE' where name in ('master', 'backend');"

  api-gateway:
    image: envoyproxy/envoy:v1.32-latest
    container_name: master_go_cqrs_api_gateway
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      swagger-ui:
        condition: service_started
    command:
      - envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --service-cluster
      - master-go-cqrs-api-gateway
      - --service-node
      - local
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/proto.pb:/etc/envoy/proto.pb:ro
    ports:
      - "8888:8888"
      - "9901:9901"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    container_name: master_go_cqrs_swagger_ui
    restart: unless-stopped
    environment:
      BASE_URL: /api/v1/swagger
      SWAGGER_JSON: /etc/swagger/swagger.json
    volumes:
      - ../docs/envoy.swagger.json:/etc/swagger/swagger.json:ro

  log-monitor:
    image: amir20/dozzle:latest
    container_name: master_go_cqrs_log_monitor
    restart: unless-stopped
    profiles:
      - dev
    environment:
      DOZZLE_LEVEL: debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9999:8080"

  log-app:
    image: busybox:latest
    container_name: master_go_cqrs_log_app
    restart: unless-stopped
    profiles:
      - dev
    command: sh -c "touch /logs/app.log && tail -n 200 -F /logs/app.log"
    volumes:
      - ../.dev/logs:/logs

  log-payment:
    image: busybox:latest
    container_name: master_go_cqrs_log_payment
    restart: unless-stopped
    profiles:
      - dev
    command: sh -c "touch /logs/payment.log && tail -n 200 -F /logs/payment.log"
    volumes:
      - ../.dev/logs:/logs

  log-affiliate:
    image: busybox:latest
    container_name: master_go_cqrs_log_affiliate
    restart: unless-stopped
    profiles:
      - dev
    command: sh -c "touch /logs/affiliate.log && tail -n 200 -F /logs/affiliate.log"
    volumes:
      - ../.dev/logs:/logs

  log-settlement:
    image: busybox:latest
    container_name: master_go_cqrs_log_settlement
    restart: unless-stopped
    profiles:
      - dev
    command: sh -c "touch /logs/settlement.log && tail -n 200 -F /logs/settlement.log"
    volumes:
      - ../.dev/logs:/logs

  log-agent:
    image: busybox:latest
    container_name: master_go_cqrs_log_agent
    restart: unless-stopped
    profiles:
      - dev
    command: sh -c "touch /logs/agent.log && tail -n 200 -F /logs/agent.log"
    volumes:
      - ../.dev/logs:/logs

  log-orchestrator:
    image: busybox:latest
    container_name: master_go_cqrs_log_orchestrator
    restart: unless-stopped
    profiles:
      - dev
    command: sh -c "touch /logs/orchestrator.log && tail -n 200 -F /logs/orchestrator.log"
    volumes:
      - ../.dev/logs:/logs

volumes:
  postgres_data:
