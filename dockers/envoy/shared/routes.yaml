# routes.yaml — Single source of truth for all API gateway routing.
# Adding a new route? Just add an entry here and run generate_config.py.
#
# Each entry is processed IN ORDER — Envoy evaluates top-to-bottom,
# so more specific routes must appear before broader prefixes.
#
# Fields:
#   path/prefix  — Exact path or prefix match (mutually exclusive)
#   method       — HTTP method constraint (optional, e.g. POST, GET)
#   cluster      — Target Envoy cluster name
#   timeout      — Per-route timeout (optional, uses defaults.timeout; set null to omit)
#   public       — If true, bypasses both JWT auth and ext_authz
#   redirect_to  — If set, this is a redirect (no cluster needed)
#   direct_response — If set, returns an inline response (status + body, no cluster)

defaults:
  timeout: 60s

routes:
  # ── Root redirect ──
  - path: /
    redirect_to: /api/v1/docs/
    public: true

  # ── API Documentation ──
  # REST API docs (Swaggo-generated)
  - prefix: /api/v1/docs/rest/
    cluster: swagger_ui_rest
    timeout: null
    public: true

  - path: /api/v1/docs/rest
    redirect_to: /api/v1/docs/rest/
    public: true

  # gRPC Gateway docs (protoc-generated)
  - prefix: /api/v1/docs/grpc/
    cluster: swagger_ui_grpc
    timeout: null
    public: true

  - path: /api/v1/docs/grpc
    redirect_to: /api/v1/docs/grpc/
    public: true

  # Docs landing page
  - path: /api/v1/docs/
    direct_response:
      status: 200
      body: '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Documentation</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#e2e8f0}.container{max-width:640px;padding:3rem 2rem;text-align:center}.title{font-size:2rem;font-weight:700;margin-bottom:.5rem;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.subtitle{font-size:1rem;color:#94a3b8;margin-bottom:2.5rem}.cards{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}.card{flex:1;min-width:220px;padding:2rem 1.5rem;background:rgba(30,41,59,.8);border:1px solid rgba(148,163,184,.15);border-radius:1rem;text-decoration:none;color:#e2e8f0;transition:all .2s}.card:hover{transform:translateY(-4px);border-color:#38bdf8;box-shadow:0 8px 30px rgba(56,189,248,.15)}.card h2{font-size:1.25rem;margin-bottom:.5rem}.card p{font-size:.875rem;color:#94a3b8}.badge{display:inline-block;font-size:.7rem;font-weight:600;padding:.2rem .6rem;border-radius:9999px;margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.05em}.badge-rest{background:rgba(52,211,153,.15);color:#34d399}.badge-grpc{background:rgba(129,140,248,.15);color:#818cf8}</style></head><body><div class="container"><h1 class="title">Master Go CQRS</h1><p class="subtitle">Choose an API documentation portal</p><div class="cards"><a class="card" href="/api/v1/docs/rest/"><span class="badge badge-rest">REST</span><h2>REST API</h2><p>HTTP endpoints for auth, users, payments, and more.</p></a><a class="card" href="/api/v1/docs/grpc/"><span class="badge badge-grpc">gRPC</span><h2>gRPC Gateway</h2><p>Protocol Buffer services via JSON transcoding.</p></a></div></div></body></html>'
    public: true

  - path: /api/v1/docs
    redirect_to: /api/v1/docs/
    public: true

  # Backward compatibility: old swagger path redirects to gRPC docs
  - prefix: /api/v1/swagger/
    redirect_to: /api/v1/docs/grpc/
    public: true

  - path: /api/v1/swagger
    redirect_to: /api/v1/docs/grpc/
    public: true

  # ── Payment service ──
  # Stripe signs the exact request bytes, so this endpoint intentionally uses
  # the payment HTTP listener. It must never be mapped to a gRPC method.
  - path: /api/v2/payments/webhooks/stripe
    method: POST
    cluster: payment_http
    timeout: 15s
    public: true

  - path: /api/v2/payments
    method: POST
    cluster: payment_grpc

  - prefix: /api/v2/payments/
    method: GET
    cluster: payment_grpc

  - path: /api/v1/payment/initiate
    method: POST
    cluster: payment_grpc

  - prefix: /api/v1/payment/checkout/
    cluster: payment_grpc
    public: true

  # ── Affiliate service ──
  - path: /api/v1/affiliate/referral/link
    method: POST
    cluster: affiliate_grpc

  - prefix: /api/v1/affiliate/rank/
    cluster: affiliate_grpc

  - prefix: /api/v1/affiliate/downline/
    cluster: affiliate_grpc

  # ── Settlement service ──
  - prefix: /api/v1/settlement/balance/
    cluster: settlement_grpc

  - path: /api/v1/settlement/withdraw
    method: POST
    cluster: settlement_grpc

  - path: /api/v1/settlement/credit/limit
    method: POST
    cluster: settlement_grpc

  # ── Agent service ──
  - path: /api/v1/agent/config/callback
    method: POST
    cluster: agent_grpc

  - path: /api/v1/agent/config/callback/verify
    method: POST
    cluster: agent_grpc

  - path: /api/v1/agent/config/key/generate
    method: POST
    cluster: agent_grpc

  - prefix: /api/v1/agent/callbacks/
    method: POST
    cluster: agent_grpc

  # ── Keycloak Identity Provider ──
  - prefix: /realms/
    cluster: keycloak
    public: true

  # ── Auth routes (HTTP backend) ──
  - path: /api/v1/auth/login
    method: POST
    cluster: api_http
    public: true

  - path: /api/v1/auth/refresh
    method: POST
    cluster: api_http
    public: true

  - path: /api/v1/auth/verify-token
    method: GET
    cluster: api_http

  - path: /api/v1/auth/info
    method: GET
    cluster: api_http

  - prefix: /api/v1/auth/
    cluster: api_http

  - prefix: /api/v1/author/
    cluster: api_http

  # ── Health & root ──
  - path: /api/v1/health
    cluster: api_http
    public: true

  - path: /api/v1
    cluster: api_http
    public: true

  # ── Catch-all (must be last) ──
  - prefix: /api/v1/
    direct_response:
      status: 404
      body: '{"error":"route not found"}'
    public: true
