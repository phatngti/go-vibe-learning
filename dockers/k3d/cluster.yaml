apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: master-go-cqrs
servers: 1
agents: 1
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "6445"
ports:
  - port: 8888:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
