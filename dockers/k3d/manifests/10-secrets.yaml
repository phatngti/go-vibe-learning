apiVersion: v1
kind: Secret
metadata:
  name: master-go-cqrs-secrets
  namespace: master-go-cqrs
type: Opaque
stringData:
  postgres-superuser-password: example
  keycloak-admin-user: admin
  keycloak-admin-password: admin
  keycloak-client-secret: local-dev-client-secret-change-me
  user-db-user: master_go_cqrs_user_user
  user-db-password: master_go_cqrs_user_password
  user-db-name: master_go_cqrs_user
  payment-db-user: master_go_cqrs_payment_user
  payment-db-password: master_go_cqrs_payment_password
  payment-db-name: master_go_cqrs_payment
  affiliate-db-user: master_go_cqrs_affiliate_user
  affiliate-db-password: master_go_cqrs_affiliate_password
  affiliate-db-name: master_go_cqrs_affiliate
  settlement-db-user: master_go_cqrs_settlement_user
  settlement-db-password: master_go_cqrs_settlement_password
  settlement-db-name: master_go_cqrs_settlement
  agent-db-user: master_go_cqrs_agent_user
  agent-db-password: master_go_cqrs_agent_password
  agent-db-name: master_go_cqrs_agent
  # Local-development key only. Production injects a KMS-backed secret from
  # the GitOps environment and uses a distinct version identifier.
  callback-signing-secret: local-callback-signing-secret-32b
  orchestrator-db-user: master_go_cqrs_orchestrator_user
  orchestrator-db-password: master_go_cqrs_orchestrator_password
  orchestrator-db-name: master_go_cqrs_orchestrator
  temporal-db-user: master_go_cqrs_temporal_user
  temporal-db-password: master_go_cqrs_temporal_password
  temporal-db-name: master_go_cqrs_temporal
  temporal-visibility-db-name: master_go_cqrs_temporal_visibility
  keycloak-db-user: master_go_cqrs_keycloak_user
  keycloak-db-password: master_go_cqrs_keycloak_password
  keycloak-db-name: master_go_cqrs_keycloak
