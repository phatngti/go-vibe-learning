apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: master-go-cqrs
  labels:
    app.kubernetes.io/name: kafka-topics
    app.kubernetes.io/part-of: master-go-cqrs
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
        app.kubernetes.io/part-of: master-go-cqrs
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xms64m -Xmx128m
          command:
            - /bin/sh
            - -ec
          args:
            - |
              broker="kafka.master-go-cqrs.svc.cluster.local:9092"
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$broker" --list >/dev/null 2>&1; do
                sleep 2
              done
              for topic in \
                payments.initiated \
                payments.events \
                affiliate.commands affiliate.events \
                settlement.commands settlement.events \
                agent.commands agent.events \
                payments.initiated.dlq payments.events.dlq \
                affiliate.commands.dlq affiliate.events.dlq \
                settlement.commands.dlq settlement.events.dlq \
                agent.commands.dlq agent.events.dlq; do
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server "$broker" \
                  --create --if-not-exists \
                  --topic "$topic" \
                  --partitions 3 \
                  --replication-factor 1
              done
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: "1"
