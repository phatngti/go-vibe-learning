apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: master-go-cqrs
spec:
  selector:
    app.kubernetes.io/name: user
  ports:
    - name: http
      port: 8889
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: master-go-cqrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user
        app.kubernetes.io/part-of: master-go-cqrs
    spec:
      containers:
        - name: user
          image: master-go-cqrs/user:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8889
          env:
            - name: SERVICE_NAME
              value: user
            - name: CONFIG_PATH
              value: /root/config/user.yaml
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: master-go-cqrs-secrets
                  key: user-db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: master-go-cqrs-secrets
                  key: user-db-password
            - name: POSTGRES_DBNAME
              valueFrom:
                secretKeyRef:
                  name: master-go-cqrs-secrets
                  key: user-db-name
            - name: KEYCLOAK_ENDPOINT
              value: http://keycloak:8080
            - name: KEYCLOAK_CLIENT_ID
              value: master-go-cqrs
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: master-go-cqrs-secrets
                  key: keycloak-client-secret
            - name: KEYCLOAK_REALM
              value: backend
            - name: KEYCLOAK_CUSTOM_HEADER_NAME
              value: Authorization
            - name: KAFKA_BROKERS
              value: kafka.master-go-cqrs.svc.cluster.local:9092
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel:4318
            - name: OTEL_SERVICE_NAME
              value: user
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
