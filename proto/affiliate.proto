syntax = "proto3";

package affiliate.v1;

import "google/api/annotations.proto";

option go_package = "github/master_go_cqrs/internal/genproto/affiliate;affiliatev1";

message RegisterReferralRequest {
  string referrer_id = 1;
  string referee_id = 2;
}

message RegisterReferralResponse {
  bool success = 1;
  string message = 2;
}

message AccumulateVolumeRequest {
  string agent_id = 1;
  double amount = 2;
}

message AccumulateVolumeResponse {
  string agent_id = 1;
  double total_volume = 2;
  string current_rank = 3;
  bool rank_promoted = 4;
}

message GetAgentRankRequest {
  string agent_id = 1;
}

message GetAgentRankResponse {
  string agent_id = 1;
  string current_rank = 2;
  double next_rank_threshold = 3;
  double progress_volume = 4;
}

message GetDownlineRequest {
  string agent_id = 1;
}

message GetDownlineResponse {
  string agent_id = 1;
  repeated string referee_ids = 2;
  int32 total_referrals = 3;
}

service AffiliateService {
  rpc RegisterReferral(RegisterReferralRequest) returns (RegisterReferralResponse) {
    option (google.api.http) = {
      post: "/api/v1/affiliate/referral/link"
      body: "*"
    };
  }
  rpc AccumulateVolume(AccumulateVolumeRequest) returns (AccumulateVolumeResponse);
  rpc GetAgentRank(GetAgentRankRequest) returns (GetAgentRankResponse) {
    option (google.api.http) = {
      get: "/api/v1/affiliate/rank/{agent_id}"
    };
  }
  rpc GetDownline(GetDownlineRequest) returns (GetDownlineResponse) {
    option (google.api.http) = {
      get: "/api/v1/affiliate/downline/{agent_id}"
    };
  }
}
