postgres:
  host: "postgres.master-go-cqrs.svc.cluster.local"
  port: "5432"
  user: "master_go_cqrs_agent_user"
  password: "master_go_cqrs_agent_password"
  dbname: "master_go_cqrs_agent"

logger:
  logLevel: "debug"
  mode: "development"
  encoding: "console"

server:
  port: 8084

keycloak:
  endpoint: "http://keycloak.master-go-cqrs.svc.cluster.local:8080"
  clientId: "master-go-cqrs"
  clientSecret: "local-dev-client-secret-change-me"
  customHeaderName: "Authorization"
  realm: "backend"

otel:
  endpoint: "otel.master-go-cqrs.svc.cluster.local:4318"
  service: "agent"

kafka:
  brokers:
    - "kafka.master-go-cqrs.svc.cluster.local:9092"
  topics:
    paymentEvents: "payments.events"
    affiliateCommands: "affiliate.commands"
    affiliateEvents: "affiliate.events"
    settlementCommands: "settlement.commands"
    settlementEvents: "settlement.events"
    agentCommands: "agent.commands"
    agentEvents: "agent.events"

# Development defaults. Production validation forces HTTPS, requires a
# verified-domain allowlist, and requires the signing key through secret-backed
# environment variables.
callback:
  requireHttps: false
  requireVerified: false
  verifiedDomains: []
  signingKeyVersion: "local-v1"
  signingSecret: ""
  requestTimeout: 10s
  dialTimeout: 3s
  tlsHandshakeTimeout: 5s
  responseHeaderTimeout: 5s
  challengeTtl: 24h
  workerEnabled: true
  workerParallelism: 4
  workerPollInterval: 1s
  workerLeaseDuration: 30s
