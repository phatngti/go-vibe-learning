postgres:
  host: "postgres.master-go-cqrs.svc.cluster.local"
  port: "5432"
  user: "master_go_cqrs_orchestrator_user"
  password: "master_go_cqrs_orchestrator_password"
  dbname: "master_go_cqrs_orchestrator"

logger:
  logLevel: "debug"
  mode: "development"
  encoding: "console"

server:
  port: 8085

keycloak:
  endpoint: "http://keycloak.master-go-cqrs.svc.cluster.local:8080"
  clientId: "master-go-cqrs"
  clientSecret: "local-dev-client-secret-change-me"
  customHeaderName: "Authorization"
  realm: "backend"

otel:
  endpoint: "otel.master-go-cqrs.svc.cluster.local:4318"
  service: "orchestrator"

kafka:
  brokers:
    - "kafka.master-go-cqrs.svc.cluster.local:9092"
  consumerMaxAttempts: 8
  retryMaxDelay: 30s
  topics:
    paymentInitiatedEvents: "payments.initiated"
    paymentEvents: "payments.events"
    affiliateCommands: "affiliate.commands"
    affiliateEvents: "affiliate.events"
    settlementCommands: "settlement.commands"
    settlementEvents: "settlement.events"
    agentCommands: "agent.commands"
    agentEvents: "agent.events"

outbox:
  enabled: true
  pollInterval: 100ms
  batchSize: 500
  parallelism: 16
  staleAfter: 2m
  maxAttempts: 20

orchestrator:
  engine: "saga"
  owner: "saga:v1"
  generation: 1
  temporal:
    address: "temporal.master-go-cqrs.svc.cluster.local:7233"
    namespace: "master-go-cqrs"
    taskQueue: "payment-orchestration"
    tlsEnabled: false
    versioningEnabled: false
    deploymentName: "payment-orchestrator"
    buildId: "local"
