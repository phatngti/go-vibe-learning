postgres:
  host: "postgres.master-go-cqrs.svc.cluster.local"
  port: "5432"
  user: "master_go_cqrs_payment_user"
  password: "master_go_cqrs_payment_password"
  dbname: "master_go_cqrs_payment"

logger:
  logLevel: "debug"
  mode: "development"
  encoding: "console"

server:
  port: 8081

gateway:
  publicBaseUrl: "http://api-gateway.master-go-cqrs.svc.cluster.local:8888"

keycloak:
  endpoint: "http://keycloak.master-go-cqrs.svc.cluster.local:8080"
  clientId: "master-go-cqrs"
  clientSecret: "local-dev-client-secret-change-me"
  customHeaderName: "Authorization"
  realm: "backend"

otel:
  endpoint: "otel.master-go-cqrs.svc.cluster.local:4318"
  service: "payment"

kafka:
  brokers:
    - "kafka.master-go-cqrs.svc.cluster.local:9092"
  consumerMaxAttempts: 8
  retryMaxDelay: 30s
  topics:
    paymentInitiatedEvents: "payments.initiated"
    paymentEvents: "payments.events"
    affiliateCommands: "affiliate.commands"
    affiliateEvents: "affiliate.events"
    settlementCommands: "settlement.commands"
    settlementEvents: "settlement.events"
    agentCommands: "agent.commands"
    agentEvents: "agent.events"

outbox:
  enabled: true
  pollInterval: 100ms
  batchSize: 500
  parallelism: 16
  staleAfter: 2m
  maxAttempts: 20

initiation:
  # Production profile must override this to true.
  requireIdempotency: false

reconciliation:
  enabled: true
  interval: 15s
  staleAfter: 2m
  batchSize: 100

paymentProvider:
  # Local development defaults to the deterministic simulator. Production must
  # set PAYMENT_PROVIDER=stripe and supply secrets through a secret manager.
  kind: "simulator"
  stripe:
    baseUrl: "https://api.stripe.com"
    httpTimeout: 10s
    webhookTolerance: 5m

legacyCheckout:
  # The v1 endpoint accepts raw card data and exists only for local learning.
  # Config.RawCardEnabled always returns false when logger.mode=production.
  rawCardEnabled: true
