postgres:
  host: "postgres.master-go-cqrs.svc.cluster.local"
  port: "5432"
  user: "master_go_cqrs_user_user"
  password: "master_go_cqrs_user_password"
  dbname: "master_go_cqrs_user"

logger:
  logLevel: "debug"
  mode: "development"
  encoding: "console"

server:
  port: 8889

keycloak:
  endpoint: "http://keycloak.master-go-cqrs.svc.cluster.local:8080"
  clientId: "master-go-cqrs"
  clientSecret: "local-dev-client-secret-change-me"
  customHeaderName: "Authorization"
  realm: "backend"

otel:
  endpoint: "otel.master-go-cqrs.svc.cluster.local:4318"
  service: "user"

# Durable Keycloak synchronization. Provider I/O is bounded by providerTimeout
# and always runs outside database/checkpoint transactions.
syncJobs:
  enabled: true
  pageSize: 100
  parallelism: 4
  pollInterval: 250ms
  leaseDuration: 1m
  providerTimeout: 15s
  maxAttempts: 12
  retryBaseDelay: 1s
  retryMaxDelay: 5m
