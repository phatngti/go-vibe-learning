version: '3'

tasks:
  proto-tools:
    desc: Install protobuf plugins needed for Go, gRPC, Envoy descriptor, and Swagger generation
    cmds:
      - |
        set -eu
        protoc_bin="${PROTOC:-}"
        if [ -z "$protoc_bin" ]; then
          for candidate in /opt/homebrew/bin/protoc /usr/local/bin/protoc /usr/bin/protoc "$(command -v protoc 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ] && "$candidate" --version >/dev/null 2>&1; then
              protoc_bin="$candidate"
              break
            fi
          done
        fi
        if [ -z "$protoc_bin" ]; then
          echo "protoc is required. Install protobuf or set PROTOC=/path/to/protoc."
          exit 1
        fi
        "$protoc_bin" --version
        export PATH="$(go env GOPATH)/bin:$PATH"
        if ! command -v protoc-gen-go >/dev/null; then
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
        fi
        if ! command -v protoc-gen-go-grpc >/dev/null; then
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
        fi
        if ! command -v protoc-gen-openapiv2 >/dev/null; then
          go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-openapiv2@v2.24.0
        fi

  gen-proto:
    desc: Regenerate Go protobuf, Envoy descriptor, and gRPC gateway Swagger docs from contracts/proto/*.proto
    cmds:
      - task: proto-tools
      - |
        set -eu
        export PATH="$(go env GOPATH)/bin:$PATH"
        mkdir -p docs/api dockers/envoy
        protoc_bin="${PROTOC:-}"
        if [ -z "$protoc_bin" ]; then
          for candidate in /opt/homebrew/bin/protoc /usr/local/bin/protoc /usr/bin/protoc "$(command -v protoc 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ] && "$candidate" --version >/dev/null 2>&1; then
              protoc_bin="$candidate"
              break
            fi
          done
        fi
        if [ -z "$protoc_bin" ]; then
          echo "protoc is required. Install protobuf or set PROTOC=/path/to/protoc."
          exit 1
        fi
        grpc_gateway_dir=$(go list -m -f '{{"{{"}}.Dir{{"}}"}}' github.com/grpc-ecosystem/grpc-gateway/v2)
        "$protoc_bin" -Icontracts -I. -Ithird_party -I"$grpc_gateway_dir" \
          --go_out=. --go_opt=module=github/master_go_cqrs \
          --go-grpc_out=. --go-grpc_opt=module=github/master_go_cqrs \
          contracts/proto/*.proto
        "$protoc_bin" -Icontracts -I. -Ithird_party -I"$grpc_gateway_dir" \
          --include_imports --include_source_info \
          --descriptor_set_out=dockers/envoy/proto.pb \
          contracts/proto/*.proto
        "$protoc_bin" -Icontracts -I. -Ithird_party -I"$grpc_gateway_dir" \
          --openapiv2_out=allow_merge=true,merge_file_name=envoy,json_names_for_fields=false,logtostderr=true:docs/api \
          contracts/proto/*.proto
        # Inject securityDefinitions into the gRPC gateway spec so Swagger UI
        # shows the Authorize button for JWT auth and OAuth2 direct login.
        tmp="$(mktemp)"
        jq '. + {
          "securityDefinitions": {
            "BearerAuth": {
              "type": "apiKey",
              "name": "Authorization",
              "in": "header",
              "description": "Type \"Bearer\" followed by a space and JWT token."
            },
            "OAuth2": {
              "type": "oauth2",
              "flow": "password",
              "tokenUrl": "http://api-gateway.master-go-cqrs.svc.cluster.local:8888/realms/backend/protocol/openid-connect/token",
              "scopes": {
                "openid": "OpenID Connect scope"
              }
            }
          },
          "security": [{"BearerAuth": []}, {"OAuth2": ["openid"]}]
        }' docs/api/envoy.swagger.json > "$tmp" && mv "$tmp" docs/api/envoy.swagger.json
        echo "Injected securityDefinitions into docs/api/envoy.swagger.json"

  swagger-tools:
    desc: Install Swaggo CLI needed for API Swagger generation
    cmds:
      - |
        set -eu
        export PATH="$(go env GOPATH)/bin:$PATH"
        if ! command -v swag >/dev/null; then
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
        fi

  gen-swagger:
    desc: Regenerate REST API Swagger docs from Go handler annotations and DTO schemas
    cmds:
      - task: swagger-tools
      - |
        set -eu
        export PATH="$(go env GOPATH)/bin:$PATH"
        swag init \
          --generalInfo main.go \
          --dir ./cmd/user,./services,./internal \
          --output docs/api \
          --outputTypes json \
          --parseInternal \
          --quiet
        # Inject OAuth2 scopes into all endpoints requiring BearerAuth
        tmp="$(mktemp)"
        jq '.paths[][] |= (if .security then .security += [{"OAuth2": ["openid"]}] else . end)' docs/api/swagger.json > "$tmp" && mv "$tmp" docs/api/swagger.json
        echo "Injected OAuth2 security requirements into docs/api/swagger.json"

  gen-docs:
    desc: Regenerate both REST Swagger docs and gRPC gateway Swagger docs
    cmds:
      - task: gen-swagger
      - task: gen-proto
      - 'echo "REST docs: docs/api/swagger.json"'
      - 'echo "gRPC docs: docs/api/envoy.swagger.json"'

  swagger-refresh:
    desc: Regenerate Swagger docs and update the k3d Swagger UI/API gateway services
    cmds:
      - task: gen-docs
      - task: k3d-sync-configmaps
      - kubectl apply -f "{{.K3D_MANIFEST_DIR}}/40-gateway.yaml"
      - kubectl -n "{{.K8S_NAMESPACE}}" rollout restart deployment/swagger-ui-rest deployment/swagger-ui-grpc deployment/api-gateway
      - kubectl -n "{{.K8S_NAMESPACE}}" rollout status deployment/swagger-ui-rest --timeout=300s
      - kubectl -n "{{.K8S_NAMESPACE}}" rollout status deployment/swagger-ui-grpc --timeout=300s
      - kubectl -n "{{.K8S_NAMESPACE}}" rollout status deployment/api-gateway --timeout=300s
      - 'echo "Docs landing:   http://api-gateway.{{.K8S_NAMESPACE}}.svc.cluster.local:8888/api/v1/docs/"'
      - 'echo "REST Swagger UI: http://api-gateway.{{.K8S_NAMESPACE}}.svc.cluster.local:8888/api/v1/docs/rest/"'
      - 'echo "gRPC Swagger UI: http://api-gateway.{{.K8S_NAMESPACE}}.svc.cluster.local:8888/api/v1/docs/grpc/"'
